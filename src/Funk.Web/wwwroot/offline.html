<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#505FDE">
    <title>No connection · Funk</title>
    <style>
        @font-face { font-family: "Archivo"; src: url("fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
        html { color-scheme: light; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
            box-sizing: border-box; background: #505FDE; color: #FFFFFF;
            font-family: "Archivo", system-ui, -apple-system, sans-serif;
        }
        main { max-width: 26rem; }
        h1 { margin: 0 0 1.5rem; color: #1D1D1B; font-weight: 900; font-stretch: 125%; font-size: clamp(3.5rem, 16vw, 5.5rem); line-height: 0.86; letter-spacing: -0.02em; text-transform: uppercase; }
        .card { background: #FFFFFF; color: #1D1D1B; border: 3px solid #1D1D1B; border-radius: 28px; padding: 1.5rem; }
        h2 { margin: 0 0 0.5rem; font-size: 1rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
        p { margin: 0 0 1.25rem; line-height: 1.45; }
        button { font: inherit; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: #FFFFFF; background: #1D1D1B;
                 border: 2.5px solid #1D1D1B; border-radius: 999px; padding: 0.75rem 1.5rem; cursor: pointer; }
        button:hover, button:focus-visible { background: #ECC8D0; color: #1D1D1B; }
        button:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 2px; }
    </style>
</head>
<body>
<main>
    <h1>Funk</h1>
    <div class="card">
        <h2>No connection</h2>
        <p>Funk runs on the Mac mini and needs a connection to it. Check that Tailscale is on, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</main>
</body>
</html>
