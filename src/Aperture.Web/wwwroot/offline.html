<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>No connection · Aperture</title>
    <style>
        @font-face { font-family: "Space Grotesk"; src: url("fonts/SpaceGrotesk-Regular-latin.woff2") format("woff2"); font-weight: 400; }
        html { color-scheme: light; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
            box-sizing: border-box; background: #000000; color: #FFFFFF;
            font-family: "Space Grotesk", Arial, Helvetica, sans-serif; font-weight: 400;
        }
        main { width: 100%; max-width: 26rem; }
        h1 { display: flex; align-items: center; gap: 0.25em; margin: 0 0 1.5rem; font-weight: 400;
             font-size: clamp(2.5rem, 12vw, 4.5rem); line-height: 1; letter-spacing: -0.01em; text-transform: uppercase; }
        .ring { flex: none; width: 1em; height: 1em; border: 0.173em solid currentColor; border-radius: 50%; box-sizing: border-box; }
        .card { background: #FFFFFF; color: #000000; border: 1px solid #000000; padding: 1.25rem; }
        h2 { margin: 0 0 0.5rem; font-size: 0.8125rem; font-weight: 400; text-transform: uppercase; }
        p { margin: 0 0 1.25rem; font-size: 0.875rem; line-height: 1.45; }
        button { font: inherit; font-size: 0.8125rem; text-transform: uppercase; color: #FFFFFF; background: #000000;
                 border: 1px solid #000000; border-radius: 0; padding: 0.5rem 0.875rem 0.375rem; cursor: pointer;
                 transition: background-color 200ms ease, color 200ms ease; }
        button:hover { background: #FFFFFF; color: #000000; }
        button:focus-visible { outline: 2px solid #000000; outline-offset: 2px; }
    </style>
</head>
<body>
<main>
    <h1><span class="ring" aria-hidden="true"></span>Aperture</h1>
    <div class="card">
        <h2 id="title">No connection</h2>
        <p id="text">Aperture isn't running. It stops when its window has been closed for a minute: open it again from
            the Start menu, the Dock or the applications menu. After an update, it restarts by itself in a minute.</p>
        <button type="button" id="retry" onclick="location.reload()">Try again</button>
    </div>
</main>
<script>
    // Shown by the service worker without Aperture, so the language comes from the browser.
    if (navigator.language.startsWith("de")) {
        document.documentElement.lang = "de";
        document.title = "Keine Verbindung · Aperture";
        document.getElementById("title").textContent = "Keine Verbindung";
        document.getElementById("text").textContent = "Aperture läuft nicht. Es beendet sich, wenn sein Fenster seit einer"
            + " Minute geschlossen ist: Öffne es wieder über das Startmenü, das Dock oder das Programmmenü. Nach einem"
            + " Update startet es in einer Minute von selbst neu.";
        document.getElementById("retry").textContent = "Erneut versuchen";
    }
</script>
</body>
</html>
