# Hands a release on to the Macs: makes it the latest release of this repository. Aperture reads
# …/releases/latest/download/latest.json (Updates:FeedUrl), and so does the installer package; release.yml publishes
# every build as a pre-release, which is never the latest. Run by hand once you've tried a release for a while:
# Actions → Promote → Run workflow. Promoting an older release goes back to it, but Macs only install newer builds.
name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote, e.g. 2026.10.20-58-ed1231e. Empty: the newest release."
        required: false

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            tag="v${VERSION#v}"
          else
            tag="$(gh release list --limit 1 --json tagName -q '.[0].tagName')"
          fi
          [ -n "$tag" ] || { echo "::error::There's no release yet. Push to main first."; exit 1; }
          assets="$(gh release view "$tag" --json assets -q '.assets[].name')"
          grep -qx latest.json <<< "$assets" \
            || { echo "::error::$tag has no latest.json; it was built before releases carried one."; exit 1; }
          # New computers install from the latest release's installers; without them, the download links would break.
          for installer in Aperture-Installer.pkg Aperture-Setup.exe; do
            grep -qx "$installer" <<< "$assets" \
              || { echo "::error::$tag has no $installer yet. Wait for its Release run to finish, or run it again."; exit 1; }
          done

          gh release edit "$tag" --prerelease=false --latest

          # What the Macs will see. GitHub may take a moment to follow, so a mismatch here is only a warning.
          feed="https://github.com/$GH_REPO/releases/latest/download/latest.json"
          echo "Feed: $feed"
          offered="$(curl -fsSL "$feed" | jq -r .version || true)"
          [ "v$offered" = "$tag" ] && echo "Feed now offers $offered" \
            || echo "::warning::The feed still offers '${offered:-nothing}'; check again in a minute."
