# Every push to main: run the tests, build the release and publish it as a pre-release of this repository, with
# latest.json, the feed entry Aperture reads (Updates:FeedUrl). Macs don't see it yet: they read the latest release,
# and pre-releases never are. promote.yml makes one the latest once you've tried it.
#
# Kept small for the free plan: no workflow artifacts or caches (the package goes to Releases, which don't count
# towards Actions storage), no run for changes that are only docs, a newer push cancels the older run, and only
# the last 5 releases are kept.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

# Only the newest push matters: a run still going when the next one starts is cancelled. gh uploads the package
# to a draft and publishes it only when complete, so a cancelled run never leaves a half release behind.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung run would otherwise burn minutes up to the 6-hour default
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number counts all commits

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --nologo

      - name: Build the release
        id: build
        run: |
          tarball="$(deploy/publish.sh)"
          version="$(basename "$tarball" -osx-arm64.tar.gz)"
          version="${version#aperture-}"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          TARBALL: ${{ steps.build.outputs.tarball }}
        run: |
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            git log --format='- %s' "$previous..HEAD" > notes.md
          else
            git log -1 --format='- %s' > notes.md
          fi

          # The feed entry: what the release is, where its package is and the package's SHA-256 (ReleaseFeed.cs).
          tag="v$VERSION"
          file="$(basename "$TARBALL")"
          jq -n \
            --arg version "$VERSION" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile notes notes.md \
            --arg page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" \
            --arg file "$file" \
            --argjson size "$(stat -c %s "$TARBALL")" \
            --arg sha256 "$(sha256sum "$TARBALL" | cut -d ' ' -f 1)" \
            --arg download "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$file" \
            '{version: $version, published: $published, notes: $notes, page: $page, file: $file, size: $size, sha256: $sha256, download: $download}' \
            > latest.json
          cat latest.json

          gh release create "$tag" "$TARBALL" latest.json --prerelease --latest=false \
            --title "Aperture $VERSION" --notes-file notes.md --target "$GITHUB_SHA"

      # Never the latest release: that's the one the Macs and the installer package download.
      - name: Keep the last 5 pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt,isLatest \
            | jq -r 'map(select(.isLatest | not)) | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
