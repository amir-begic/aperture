# Every push to main: run the tests, build a package per system (macOS, Windows, Linux) and publish them as a
# pre-release of this repository, with latest.json, the feed entry Aperture reads (Updates:FeedUrl). Installed copies
# don't see it yet: they read the latest release, and pre-releases never are. promote.yml makes one the latest once
# you've tried it. Two more jobs build the installers around the packages and attach them, so the latest ones are
# always at …/releases/latest/download/Aperture-Installer.pkg (macOS) and …/Aperture-Setup.exe (Windows). On Linux,
# the package is the installer (install.sh inside).
#
# Kept small for the free plan: no workflow artifacts or caches (the package goes to Releases, which don't count
# towards Actions storage), no run for changes that are only docs, a newer push cancels the older run, and only
# the last 5 releases are kept.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

# Only the newest push matters: a run still going when the next one starts is cancelled. gh uploads the package
# to a draft and publishes it only when complete, so a cancelled run never leaves a half release behind.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung run would otherwise burn minutes up to the 6-hour default
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number counts all commits

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --nologo

      - name: Build the releases
        id: build
        env:
          # Each release remembers its feed (feed.url), so the Windows and Linux installers needn't know it.
          APERTURE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          for runtime in osx-arm64 win-x64 linux-x64; do
            deploy/publish.sh "$runtime"
          done
          version="$(basename artifacts/aperture-*-osx-arm64.tar.gz -osx-arm64.tar.gz)"
          echo "version=${version#aperture-}" >> "$GITHUB_OUTPUT"

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            git log --format='- %s' "$previous..HEAD" > notes.md
          else
            git log -1 --format='- %s' > notes.md
          fi

          # The feed entry: what the release is, and per system where its package is and the package's SHA-256
          # (ReleaseFeed.cs).
          tag="v$VERSION"
          packages='{}'
          for tarball in artifacts/aperture-*.tar.gz; do
            file="$(basename "$tarball")"
            runtime="${file#aperture-$VERSION-}"
            runtime="${runtime%.tar.gz}"
            packages="$(jq -c \
              --arg runtime "$runtime" \
              --arg file "$file" \
              --argjson size "$(stat -c %s "$tarball")" \
              --arg sha256 "$(sha256sum "$tarball" | cut -d ' ' -f 1)" \
              --arg download "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$file" \
              '. + {($runtime): {file: $file, size: $size, sha256: $sha256, download: $download}}' <<< "$packages")"
          done
          jq -n \
            --arg version "$VERSION" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile notes notes.md \
            --arg page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" \
            --argjson packages "$packages" \
            '{version: $version, published: $published, notes: $notes, page: $page, packages: $packages}' \
            > latest.json
          cat latest.json

          gh release create "$tag" artifacts/aperture-*.tar.gz latest.json --prerelease --latest=false \
            --title "Aperture $VERSION" --notes-file notes.md --target "$GITHUB_SHA"

      # Never the latest release: that's the one the Macs and the installer package download.
      - name: Keep the last 5 pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt,isLatest \
            | jq -r 'map(select(.isLatest | not)) | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done

  # The installers are built around the release's packages, on the systems whose tools they need. The packages come
  # from the release itself, not as workflow artifacts, so nothing counts towards Actions storage.
  mac-installer:
    needs: release
    runs-on: macos-latest   # pkgbuild and productbuild only exist on macOS
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the installer and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.release.outputs.version }}
        run: |
          gh release download "$TAG" --pattern 'aperture-*-osx-arm64.tar.gz' --dir artifacts
          deploy/macos/pkg/build-pkg.sh artifacts/aperture-*-osx-arm64.tar.gz \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          gh release upload "$TAG" artifacts/Aperture-Installer.pkg

  windows-installer:
    needs: release
    runs-on: windows-latest   # Inno Setup only runs on Windows
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build the setup and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release download "v$VERSION" --pattern 'aperture-*-win-x64.tar.gz' --dir artifacts
          tar -xzf artifacts/aperture-*-win-x64.tar.gz -C artifacts
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$iscc" ] || choco install innosetup --yes --no-progress
          # 2026.10.20-58-ed1231e → 2026.10.20.58: Windows wants a numeric version; the build number only grows.
          numeric="$(sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)-.*/\1.\2/' <<< "$VERSION")"
          "$iscc" /Qp "/DReleaseDir=$(cygpath -w "$PWD/artifacts/aperture-$VERSION")" "/DVersion=$numeric" \
            "/DOutputDir=$(cygpath -w "$PWD/artifacts")" deploy/windows/aperture.iss
          gh release upload "v$VERSION" artifacts/Aperture-Setup.exe
